name: Build P1xel Lab (Windows, Mac, Linux)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      # Every build gets a new version (1.0.<build number>) so launchers can spot the update
      - run: npm version 1.0.${{ github.run_number }} --no-git-tag-version --allow-same-version
      - run: npx electron-builder ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: p1xel-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  release:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=1.0.${{ github.run_number }}
          git log -1 --format=%B | grep -v -E '^(Co-Authored-By|Claude-Session):' > notes.txt
          cat >> notes.txt <<'NOTES'

          ---
          **Download:**
          - **Windows:** P1xel-Lab-Setup.exe (installer) or P1xel-Lab-Portable.exe (no install)
          - **Mac** (Intel + Apple Silicon): P1xel-Lab-Mac.dmg. The first time, right-click the app, then choose Open.
          - **Linux:** P1xel-Lab-Linux.AppImage (any distro: make it executable, then run it) or P1xel-Lab-Linux.deb (Ubuntu/Debian)
          NOTES
          gh release delete latest --yes --cleanup-tag || true
          gh release create "v$VERSION" out/* --title "P1xel Lab v$VERSION" --notes-file notes.txt --latest
