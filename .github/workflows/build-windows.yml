name: Build P1xel Lab for Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      # Every build gets a new version (1.0.<build number>) so launchers can spot the update
      - run: npm version 1.0.${{ github.run_number }} --no-git-tag-version --allow-same-version
      - run: npx electron-builder --win nsis portable --x64 --publish never
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=1.0.${{ github.run_number }}
          git log -1 --format=%B | grep -v -E '^(Co-Authored-By|Claude-Session):' > notes.txt
          printf '\n---\nDownload **P1xel-Lab-Setup.exe** to install, or **P1xel-Lab-Portable.exe** to run without installing.\n' >> notes.txt
          gh release delete latest --yes --cleanup-tag || true
          gh release create "v$VERSION" dist/P1xel-Lab-Setup.exe dist/P1xel-Lab-Portable.exe --title "P1xel Lab v$VERSION" --notes-file notes.txt --latest
