name: Build P1xel Lab for Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx electron-builder --win nsis portable --x64 --publish never
      - name: Publish download page
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/*.exe --title "P1xel Lab (latest build)" --notes "Download **P1xel Lab Setup 1.0.0.exe** to install, or **P1xel Lab 1.0.0.exe** to run without installing."
